name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (checker rules, tokens, blueprints, MCP server, skill package)
        run: python -m unittest discover -s tests -v
      - name: Every example page passes the checker
        run: |
          for f in b2b-ui-designer/examples/*.html; do
            echo "== $f"
            python b2b-ui-designer/scripts/check_page.py "$f"
          done
      - name: Every style direction passes contrast
        run: |
          for d in enterprise modern-saas fintech-trust developer editorial; do
            python b2b-ui-designer/scripts/tokens.py "$d" --report > /dev/null
          done
      - name: Example token blocks match the generator
        run: |
          python b2b-ui-designer/examples/build_examples.py
          git diff --exit-code -- b2b-ui-designer/examples
